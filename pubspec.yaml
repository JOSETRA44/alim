name: alim
description: "ALIM — mensajería ultra-personalizable. Composition root de la app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

workspace:
  - packages/alim_core
  - packages/alim_engine
  - packages/alim_engine_mock
  - packages/alim_spec
  - packages/alim_theme_engine

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  path_provider: ^2.1.0
  alim_core: any
  alim_engine: any
  alim_engine_mock: any
  alim_spec: any
  alim_theme_engine: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
